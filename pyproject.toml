[project]
name = "slack-ai-assistant"
version = "0.1.0"
description = "Slack bot powered by Claude for calendar, email, and contacts"
requires-python = ">=3.11,<3.13"

dependencies = [
    "slack-bolt>=1.21.0",
    "slack-sdk>=3.27.0",
    "anthropic>=0.30.0",
    "google-api-python-client>=2.130.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402", "E722"]
